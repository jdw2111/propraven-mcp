name: Publish to npm

# Publishes @propraven/mcp to npm via GitHub Actions OIDC trusted publishing.
# No long-lived NPM_TOKEN required — npm verifies the workflow's OIDC token.
#
# IMPORTANT: OIDC trusted publishing requires npm 11+. Node 20 ships with
# npm 10, so we install npm 11 explicitly before the publish step.
#
# To set up the trusted publisher (one-time):
#   1. Visit https://www.npmjs.com/package/@propraven/mcp/access
#   2. Trusted Publishers → Add → GitHub Actions
#   3. Owner: jdw2111, Repo: propraven-mcp, Workflow: publish-npm.yml, Environment: (blank)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 11 (required for OIDC trusted publishing)
        run: |
          # npm@latest (12.x) refuses Node 20/early 22; trusted publishing needs >= 11.5.
          npm install -g npm@^11.5
          npm --version

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$want" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ($want)"; exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish (OIDC trusted publishing, with provenance)
        run: npm publish --access public --provenance
